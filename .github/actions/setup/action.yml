name: Build tools
description: Configure Java, Android and Gradle
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1'
    - uses: gradle/actions/setup-gradle@v6
