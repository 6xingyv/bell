name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download signed packages
        uses: actions/download-artifact@v7
        with:
          name: bell-android
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p release-assets-renamed
          while IFS= read -r -d '' file; do
            relative="${file#release-assets/}"
            asset_name="${relative//\//-}"
            cp "$file" "release-assets-renamed/$asset_name"
          done < <(find release-assets -type f -print0)
          mapfile -d '' assets < <(find release-assets-renamed -type f -print0)
          test "${#assets[@]}" -gt 0
          revision_range="$GITHUB_SHA"
          note_options=()
          if previous_tag=$(git describe --tags --abbrev=0 --first-parent --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null); then
            revision_range="$previous_tag..$GITHUB_SHA"
            note_options+=(--notes-start-tag "$previous_tag")
          fi
          translation_locales=$(git log --format=%s "$revision_range" |
            sed -nE 's/^l10n\(([A-Za-z0-9-]+)\):.*/\1/p' | LC_ALL=C sort -u)
          if [[ -n "$translation_locales" ]]; then
            translation_notes=$(
              printf '## Translations\n\n'
              while IFS= read -r locale; do
                printf -- '- Updated `%s` translations.\n' "$locale"
              done <<< "$translation_locales"
            )
            note_options+=(--notes "$translation_notes")
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "Bell $GITHUB_REF_NAME" \
            --generate-notes "${note_options[@]}"
