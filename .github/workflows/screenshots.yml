name: Capture Bell screenshots
on:
  workflow_call:
    inputs:
      package_run_id:
        type: string
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maestro CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/maestro"
          cd "$RUNNER_TEMP/maestro"
          gh release download cli-2.12.1 --repo mobile-dev-inc/Maestro \
            --pattern maestro.zip --pattern checksums_sha256.txt
          grep -E '[[:space:]]\*?maestro\.zip$' checksums_sha256.txt | sha256sum --check
          unzip -q maestro.zip
          echo "$PWD/maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check out the Jellyfin lyrics fixture server
        uses: actions/checkout@v7
        with:
          repository: 6xingyv/jellyfin
          ref: cbb924872487bb600db6c70d3f68f112386e5495 # jellyfin/jellyfin#17011
          path: jellyfin-fixture-source
          persist-credentials: false
      - name: Start and seed Jellyfin
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          dotnet publish jellyfin-fixture-source/Jellyfin.Server/Jellyfin.Server.csproj \
            --configuration Release --output "$RUNNER_TEMP/jellyfin" -p:RunAnalyzersDuringBuild=false
          dotnet build-server shutdown
          fixture="$RUNNER_TEMP/bell-fixture"
          mkdir -p "$fixture/config"
          cat > "$fixture/config/network.xml" <<'EOF'
          <NetworkConfiguration><InternalHttpPort>18096</InternalHttpPort><PublicHttpPort>18096</PublicHttpPort><EnableIPv6>false</EnableIPv6><LocalNetworkAddresses><string>127.0.0.1</string></LocalNetworkAddresses></NetworkConfiguration>
          EOF
          "$RUNNER_TEMP/jellyfin/jellyfin" --nowebclient --ffmpeg "$(command -v ffmpeg)" \
            --datadir "$fixture/data" --configdir "$fixture/config" \
            --cachedir "$fixture/cache" --logdir "$fixture/log" > "$fixture/server.log" 2>&1 &
          curl -fsS --retry 90 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:18096/System/Info/Public
          node .github/screenshots/prepare-library.mjs "$fixture/music" http://127.0.0.1:18096
      - name: Download the release build
        uses: actions/download-artifact@v7
        with:
          name: bell-android
          path: packages
          github-token: ${{ inputs.package_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
      - name: Select the emulator APK and enable KVM
        shell: bash
        run: |
          apk=$(find packages -type f -path '*/apk/release/*.apk' -print -quit)
          test -n "$apk"
          echo "BELL_APK=$GITHUB_WORKSPACE/$apk" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture phone and landscape tablet screenshots
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -memory 2048 -cores 2 -no-snapshot -noaudio -no-boot-anim
          script: |
            export ANDROID_SERIAL=emulator-5554
            adb -s "$ANDROID_SERIAL" reverse tcp:18096 tcp:18096
            adb -s "$ANDROID_SERIAL" install "$BELL_APK"
            adb -s "$ANDROID_SERIAL" shell wm size 1080x2400
            adb -s "$ANDROID_SERIAL" shell wm density 392
            adb -s "$ANDROID_SERIAL" shell cmd uimode night no
            adb -s "$ANDROID_SERIAL" shell settings put system font_scale 1.0
            adb -s "$ANDROID_SERIAL" shell settings put global device_name Bell-Demo-Phone
            adb -s "$ANDROID_SERIAL" shell settings put global sysui_demo_allowed 1
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command exit
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command enter
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command network -e airplane hide -e wifi show -e level 4 -e fully true -e mobile hide
            adb -s "$ANDROID_SERIAL" shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            maestro --device "$ANDROID_SERIAL" test -e BELL_SERVER=http://127.0.0.1:18096 --test-output-dir maestro-output .github/screenshots/phone.yaml
            adb -s "$ANDROID_SERIAL" shell wm size 1000x1600
            adb -s "$ANDROID_SERIAL" shell wm density 200
            maestro --device "$ANDROID_SERIAL" test --test-output-dir maestro-output .github/screenshots/tablet.yaml
      - name: Collect the nine README images
        shell: bash
        run: |
          mkdir screenshots
          for name in home-phone library-phone search-phone album-phone album-artists-phone now-playing-phone lyrics-phone audio-output-phone lyrics-tablet-landscape; do
            mapfile -t matches < <(find maestro-output -type f -path "*/takeScreenshot/$name.png")
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "screenshots/$name.png"
          done
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: bell-screenshots
          if-no-files-found: error
          path: screenshots/*.png
      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bell-screenshot-diagnostics
          if-no-files-found: ignore
          path: |
            maestro-output/
            ${{ runner.temp }}/bell-fixture/server.log
