[package]
name = "decoder-ffmpeg"
version = "0.1.0"
edition = "2024"

[lib]
name = "decoder_ffmpeg"
crate-type = ["rlib"]

[dependencies]
engine-core = { version = "0.1.0", path = "../core" }
ffmpeg-next = "8.1.0"
libc = "0.2"
ringbuf = "0.4.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
