[package]
name = "fabric-audio-adapter"
version = "0.1.0"
edition = "2024"

[lib]
name = "fabric_audio_adapter"
crate-type = ["rlib"]

[features]
default = []
engine-adapter = ["dep:engine", "dep:types", "dep:util"]
# Binds the audio control protocol to the fabric SDK session ports (the async
# "protocol engine ↔ sdk" layer). Off by default: it path-depends on the
# sibling foundation.fabric checkout, so the normal Android build is unaffected.
sdk-bridge = ["dep:fabric-sdk", "dep:fabric-core", "dep:tokio", "dep:bytes", "dep:async-trait"]
# Talks to a running hub through the fabric-client broker SDK (preferred for
# apps): control via invoke, media/assets via named broker streams. Off by
# default for the same sibling-checkout reason as sdk-bridge.
client = ["dep:fabric-client", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
engine = { path = "../engine", optional = true }
types = { path = "../types", optional = true }
util = { path = "../util", optional = true }
fabric-sdk = { path = "../../../fabric/crates/sdk", optional = true }
fabric-core = { path = "../../../fabric/crates/core", optional = true }
fabric-client = { path = "../../../fabric/crates/client", optional = true }
tokio = { version = "1", features = ["sync", "rt", "macros"], optional = true }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread"] }
