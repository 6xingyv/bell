[package]
name = "jni-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "jni_bridge"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ndk-context = "0.1"
libc = "0.2"
ffmpeg-next = "8.1.0"
serde_json = "1"
engine = { path = "../engine" }
fabric-audio-adapter = { path = "../fabric-adapter", features = ["engine-adapter"] }
source = { path = "../source" }
types = { path = "../types" }
util = { path = "../util" }
ebur128 = "0.1.10"
