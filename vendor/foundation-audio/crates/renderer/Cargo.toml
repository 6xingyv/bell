[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "renderer"
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.102"
ringbuf = "0.4.8"
types = { path = "../types" }

[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.17.3"
